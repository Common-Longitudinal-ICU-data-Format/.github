name: Mirror project repos

# Once a week, copy the repo of every project run that has closed in the CLIF
# portal tracker into this organization (a snapshot, refreshed only when a
# rerun of the project closes), so the
# code is found by org-wide code search, and add the project to the list in
# profile/README.md (committed straight to main, here and in .github-private).
# See scripts/mirror_projects.py.

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: report what would happen, change nothing'
        type: boolean
        default: true
      backfill:
        description: 'Also mirror the external repos already linked in the Projects list (run once)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror-projects
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORG_MIRROR_TOKEN }}
          fetch-depth: 0

      - name: Mirror closed project runs
        env:
          GH_TOKEN: ${{ secrets.ORG_MIRROR_TOKEN }}
          PORTAL_MIRROR_TOKEN: ${{ secrets.PORTAL_MIRROR_TOKEN }}
          PORTAL_URL: https://clif-icu.com
          # Scheduled runs have no inputs and are never dry runs.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}
        run: python3 scripts/mirror_projects.py
